<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 889 400" width="889" height="400" role="img" aria-label="Kyu">
<title>Kyu</title>
<!--
  기계가 만든다: node scripts/make-lockup.mjs
  글자는 **패스**다 — 폰트 없이도 어디서나 똑같이 나온다.
  Onest 600 · SIL OFL 1.1 (brand/fonts/Onest/OFL.txt)
-->
  <svg x="0" y="0" width="400" height="400" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
<title>Kyu</title>
<!--
  큐의 표식 — 말풍선 방울. **벡터 원본.**

  ★ `kyu-icon.html` 의 CSS 를 좌표로 옮긴 것이다. 광고·인쇄·큰 화면은 래스터로
    감당이 안 되므로 이쪽이 원본 노릇을 한다. 두 판이 **같은 로고인지**는
    짐작하지 않고 잰다 — `scripts/icon-svg-check.mjs` 가 둘을 512px 로 그려
    화소로 맞대고, 어긋나면 빨개진다.

  ★★ 좌표는 CSS 에서 계산해 옮겼다:
     · 타일 512×512, 모서리 23.5% = 120.32
     · 방울 상자 left 50 · top 44 · 412×404
     · 모서리 반지름 `50% 48% 47% 13% / 49% 50% 49% 15%`
       → 가로(412 기준) 206 · 197.76 · 193.64 · 53.56
       → 세로(404 기준) 197.96 · 202 · 197.96 · 60.6
     · 눈 60×62, 타일좌표 (170,210) · (298,210) → 중심 (200,241) · (328,241)

  ★★★ CSS `filter: blur(N)` 은 stdDeviation=N 이고, `box-shadow` 의 흐림 반지름은
    2σ 다. 옮길 때 그걸 갈라 적용했다 — 안 그러면 빛번짐이 두 배로 퍼진다.
-->
<defs>
  <!-- 타일 바탕: radial-gradient(120% 100% at 50% 0%) -->
  <radialGradient id="lk-tileBg" gradientUnits="userSpaceOnUse"
      cx="256" cy="0" r="614.4"
      gradientTransform="translate(256,0) scale(1,0.83333) translate(-256,0)">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.58" stop-color="#f1f6fe"/>
    <stop offset="1" stop-color="#e4edfc"/>
  </radialGradient>

  <!-- 방울 본체: radial-gradient(98% 94% at 36% 26%) — 방울 상자 기준 -->
  <radialGradient id="lk-dropBody" gradientUnits="userSpaceOnUse"
      cx="148.32" cy="105.04" r="403.76"
      gradientTransform="translate(148.32,105.04) scale(1,0.94056) translate(-148.32,-105.04)">
    <stop offset="0"    stop-color="#ffffff" stop-opacity="0.97"/>
    <stop offset="0.16" stop-color="#e1efff" stop-opacity="0.96"/>
    <stop offset="0.40" stop-color="#afcffc" stop-opacity="0.97"/>
    <stop offset="0.62" stop-color="#8bc0fa"/>
    <stop offset="0.80" stop-color="#66a4f0"/>
    <stop offset="1"    stop-color="#4d8ada"/>
  </radialGradient>

  <!-- 두께 — 위·오른쪽 어깨가 짙다 (inset -34px 28px 78px 를 방향 그라디언트로) -->
  <linearGradient id="lk-shoulder" gradientUnits="userSpaceOnUse" x1="412" y1="0" x2="120" y2="300">
    <stop offset="0"   stop-color="#6b7a8b" stop-opacity="0.30"/>
    <stop offset="0.45" stop-color="#6b7a8b" stop-opacity="0.06"/>
    <stop offset="1"   stop-color="#6b7a8b" stop-opacity="0"/>
  </linearGradient>
  <!-- 아래쪽으로 앉는 무게 (inset 0 -26px 46px) -->
  <linearGradient id="lk-sit" gradientUnits="userSpaceOnUse" x1="0" y1="404" x2="0" y2="300">
    <stop offset="0"   stop-color="#6a7782" stop-opacity="0.20"/>
    <stop offset="1"   stop-color="#6a7782" stop-opacity="0"/>
  </linearGradient>
  <!-- 왼쪽 위로 도는 반사광 (inset 24px 10px 44px) -->
  <linearGradient id="lk-lift" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="140">
    <stop offset="0"   stop-color="#6c7f9a" stop-opacity="0.16"/>
    <stop offset="1"   stop-color="#6c7f9a" stop-opacity="0"/>
  </linearGradient>
  <!-- 빛이 빠져나가는 아래·오른쪽 굴절 테 -->
  <linearGradient id="lk-refract" gradientUnits="userSpaceOnUse" x1="412" y1="404" x2="250" y2="250">
    <stop offset="0"   stop-color="#e6f2ff" stop-opacity="0.55"/>
    <stop offset="1"   stop-color="#e6f2ff" stop-opacity="0"/>
  </linearGradient>

  <filter id="lk-b17" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="17"/></filter>
  <filter id="lk-b37" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="37"/></filter>
  <filter id="lk-b155" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="15.5"/></filter>
  <filter id="lk-b93" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9.3"/></filter>
  <filter id="lk-b112" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11.2"/></filter>
  <filter id="lk-b25" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
  <filter id="lk-b22" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>

  <!-- 방울 윤곽. 두 번 쓰므로 정의해 둔다. -->
  <path id="lk-drop" d="M 206 0
    L 214.24 0
    A 197.76 202 0 0 1 412 202
    L 412 206.04
    A 193.64 197.96 0 0 1 218.36 404
    L 53.56 404
    A 53.56 60.6 0 0 1 0 343.4
    L 0 197.96
    A 206 197.96 0 0 1 206 0 Z"/>

  <!-- inset 그림자의 초승달. 원래 모양에서 **옮긴 모양을 빼면** 그 자리가 남는다. -->
  <mask id="lk-rimTop" maskUnits="userSpaceOnUse" x="-20" y="-20" width="452" height="444">
    <use href="#lk-drop" fill="#fff"/><use href="#lk-drop" fill="#000" transform="translate(0,3)"/>
  </mask>
  <mask id="lk-rimBottom" maskUnits="userSpaceOnUse" x="-20" y="-20" width="452" height="444">
    <use href="#lk-drop" fill="#fff"/><use href="#lk-drop" fill="#000" transform="translate(0,-3)"/>
  </mask>

  <clipPath id="lk-tileClip"><rect x="0" y="0" width="512" height="512" rx="120.32" ry="120.32"/></clipPath>
  <clipPath id="lk-dropClip"><use href="#lk-drop"/></clipPath>
</defs>

<g clip-path="url(#lk-tileClip)">
  <rect x="0" y="0" width="512" height="512" fill="url(#lk-tileBg)"/>

  <g transform="translate(50,44)">
    <!-- 스스로 내는 빛 — 옅은 바탕 위에서 번진다 -->
    <use href="#lk-drop" fill="#91baf9" opacity="0.50" filter="url(#lk-b17)"/>
    <use href="#lk-drop" fill="#91baf9" opacity="0.30" filter="url(#lk-b37)" transform="translate(0,4)"/>

    <!-- 본체 -->
    <use href="#lk-drop" fill="url(#lk-dropBody)"/>

    <g clip-path="url(#lk-dropClip)">
      <!-- 안에 갇힌 빛 — 아래에 고인 코스틱.
           ★ `.caustic` 의 opacity 는 **묶음에 걸린다**(자식이 먼저 합성된 뒤 곱해진다).
             그래서 여기서도 <g opacity>로 묶는다 — 자식에 따로 걸면 두 배로 곱해진다.
           ★★ CSS 에는 `.caustic i` 규칙도 있지만 **마크업에 `<i>` 가 없다.**
             그 규칙은 아무것도 안 그린다. 처음엔 그걸 SVG 에 옮겨 그려서
             왼쪽 아래에 없는 빛이 하나 생겼다 — **코드에 있는 것과 그려지는 것은
             다르다.** 규칙이 아니라 **나온 그림**을 옮겨야 한다. -->
      <g opacity="0.30">
        <ellipse cx="197.76" cy="260.58" rx="111.24" ry="54.54" fill="#d3ecff" filter="url(#lk-b155)"/>
        <ellipse cx="195.53" cy="260.58" rx="51.17"  ry="21.82" fill="#eef7ff" filter="url(#lk-b93)"/>
      </g>

      <!-- 두께 -->
      <use href="#lk-drop" fill="url(#lk-shoulder)"/>
      <use href="#lk-drop" fill="url(#lk-sit)"/>
      <use href="#lk-drop" fill="url(#lk-lift)"/>
      <use href="#lk-drop" fill="url(#lk-refract)"/>

      <!-- 표면을 미끄러지는 하이라이트 -->
      <ellipse cx="144.20" cy="66.66"  rx="103"   ry="50.5"  fill="#ffffff" opacity="0.276"
               filter="url(#lk-b112)" transform="rotate(-16 144.20 66.66)"/>
      <ellipse cx="119.48" cy="55.55"  rx="53.56" ry="19.19" fill="#ffffff" opacity="0.294"
               filter="url(#lk-b25)"  transform="rotate(-20 119.48 55.55)"/>
      <ellipse cx="275.01" cy="72.72"  rx="19.57" ry="12.12" fill="#ffffff" opacity="0.255"
               filter="url(#lk-b22)"  transform="rotate(-20 275.01 72.72)"/>

      <!-- 유리 테 — 위는 흰빛, 아래는 굴절된 하늘빛.
           ★★★ `inset 0 3px 0` 은 **획이 아니다.** 모양을 3px 내린 것과 원래 모양의
             차집합 — 즉 **위쪽에만 걸린 초승달**이다. 처음엔 내린 모양에 획을
             둘렀는데, 그러면 사방에 고리가 생겨 유리 테가 아니라 테두리선이 됐다.
             (실제로 눈에 보였다. 숫자로는 평균 4.2/255 라 안 걸렸다 —
              **평균은 가는 선을 못 본다.**) -->
      <use href="#lk-drop" fill="#ffffff" opacity="0.255" mask="url(#lk-rimTop)"/>
      <use href="#lk-drop" fill="#d5e9ff" opacity="0.255" mask="url(#lk-rimBottom)"/>
      <use href="#lk-drop" fill="none" stroke="#ffffff" stroke-opacity="0.078" stroke-width="5"/>
    </g>
  </g>

  <!-- 눈. **반사도 그림자도 없다 — 단색 한 겹이다.**
       광택이 붙으면 그게 곧 3D 신호라 "3D 를 줄여라" 와 정면으로 부딪히고,
       16px 에서 반사는 어차피 사라지면서 눈만 희석시킨다. -->
  <ellipse cx="200" cy="241" rx="30" ry="31" fill="#1c4b9e"/>
  <ellipse cx="328" cy="241" rx="30" ry="31" fill="#1c4b9e"/>
</g>
</svg>

  <g transform="translate(452.00,277.14)"><g transform="scale(0.232000,-0.232000)" fill="#10131a"><path d="M78.99951171875 0V707.4000244140625H203.601806640625V403.0013427734375H304.8016357421875L504.5997314453125 707.4000244140625H647.0023193359375L410.6033935546875 361.2003173828125L647.4022216796875 0H501.599609375L311.2015380859375 288.7991943359375H203.601806640625V0Z" transform="translate(0.00,0)"/><path d="M288.19970703125 -240.80029296875Q229.599609375 -240.80029296875 172.69952392578125 -224.40032958984375Q115.7994384765625 -208.0003662109375 66.7991943359375 -168.800537109375L110.599609375 -71.398681640625Q144.79931640625 -97.598388671875 188.49932861328125 -114.19830322265625Q232.1993408203125 -130.7982177734375 284.9993896484375 -130.7982177734375Q364.19921875 -130.7982177734375 397.39910888671875 -90.0986328125Q430.5989990234375 -49.3990478515625 430.5989990234375 20.000732421875V59.3992919921875Q412.9990234375 35.5994873046875 386.89910888671875 20.69964599609375Q360.7991943359375 5.7998046875 330.79937744140625 -1.10009765625Q300.799560546875 -8 269.7998046875 -8Q192.9998779296875 -8 147.39984130859375 23.60003662109375Q101.7998046875 55.2000732421875 81.79974365234375 110.60009765625Q61.7996826171875 166.0001220703125 61.7996826171875 237.2000732421875V527H183.6019287109375V263.600341796875Q183.6019287109375 234.80078125 187.3018798828125 205.901123046875Q191.0018310546875 177.00146484375 202.6016845703125 153.40167236328125Q214.2015380859375 129.8018798828125 237.601318359375 115.60198974609375Q261.0010986328125 101.402099609375 300.4007568359375 101.402099609375Q351.400390625 101.402099609375 379.29998779296875 126.40191650390625Q407.1995849609375 151.4017333984375 418.09930419921875 191.2012939453125Q428.9990234375 231.0008544921875 428.9990234375 276.0001220703125V527H550.80126953125V50.403076171875Q550.80126953125 -16.5975341796875 536.5013427734375 -70.39813232421875Q522.201416015625 -124.19873046875 491.20135498046875 -162.19921875Q460.2012939453125 -200.19970703125 410.200927734375 -220.5Q360.2005615234375 -240.80029296875 288.19970703125 -240.80029296875Z" transform="translate(632.00,0)"/><path d="M291.80029296875 -6.800048828125Q178 -6.800048828125 117.499755859375 52.20001220703125Q56.99951171875 111.2000732421875 56.99951171875 231.60009765625V527H178.8017578125V239.600341796875Q178.8017578125 198.0009765625 190.6015625 167.20135498046875Q202.4013671875 136.4017333984375 227.50103759765625 119.50189208984375Q252.6007080078125 102.60205078125 291.80029296875 102.60205078125Q333.7999267578125 102.60205078125 358.19952392578125 120.30194091796875Q382.59912109375 138.0018310546875 392.6988525390625 169.20147705078125Q402.798583984375 200.401123046875 402.798583984375 239.600341796875V527H524.600830078125V231.60009765625Q524.600830078125 107.9998779296875 463.5006103515625 50.59991455078125Q402.400390625 -6.800048828125 291.80029296875 -6.800048828125Z" transform="translate(1217.00,0)"/></g></g>
</svg>